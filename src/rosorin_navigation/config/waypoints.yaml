# Waypoints for rosorin_navigation waypoint_follower, in the frame of maps/house.yaml.
# x, y in metres, yaw in radians. The robot spawns at the map origin (0, 0, 0).
# Every point has at least 0.6 m clearance from walls and furniture on the map; the route visits every
# room of the house and includes (3.0, -1.5), whose path is U-shaped around the bookshelf wall
# (docs/DEBUG_LOG.md ISSUE-018).
frame_id: map
waypoints:
  - {name: kitchen, x: -3.0, y: 2.5, yaw: 1.57}
  - {name: dining_west, x: 0.5, y: 3.0, yaw: 0.0}
  - {name: dining_east, x: 4.0, y: 2.0, yaw: -1.57}
  - {name: bedroom, x: 3.0, y: -1.5, yaw: 3.14}
  - {name: sofa, x: -0.5, y: -2.5, yaw: 3.14}
  - {name: tea_table, x: -3.5, y: -1.0, yaw: 1.57}
  - {name: start, x: 0.0, y: 0.0, yaw: 0.0}
