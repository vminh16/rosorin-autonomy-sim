# robot_localization EKF for sim.launch.py realism:=true, in the place of the real robot's
# ekf_filter_node (wiki 2.1.4: wheel odometry /odom_raw + /imu fused, output remapped to /odom).
# The wiki does not show the vendor's ekf yaml; this one fuses what the real sensors can measure:
# body velocities from the wheels and the yaw rate from the gyro. The IMU orientation is not used
# (the simulated one is the true heading; the real one has no magnetometer).
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az
    odom0: /odom_raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
